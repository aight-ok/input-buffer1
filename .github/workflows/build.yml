
name: Build Input Buffer for iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: iOS

      - name: Upload the .geode file
        uses: actions/upload-artifact@v4
        with:
          name: input-buffer-ios
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

